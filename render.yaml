services:
  - type: web
    name: smart-campus
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENABLE_NEURAL_MODEL
        value: "false"
